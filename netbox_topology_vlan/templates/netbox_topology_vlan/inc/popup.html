<style>
    {% include 'netbox_topology_vlan/css/style-popup.css' %}
</style>
<template id="edge-popup-template">
    <div>
        <strong class="popup-header">
            <i class="mdi mdi-information-outline"></i> Detalhes da Ligação
        </strong>
        <div class="popup-body">
            Porta <span class="porta-a"></span> (<span class="modo-a"></span>)<br>
            Porta <span class="porta-b"></span> (<span class="modo-b"></span>)<br>


            <div class="trunk-vlans-box" style="display: none; margin-top: 5px;">
                <span style="color: #f97316; font-weight: bold;">VLANs no Trunk:</span> 
                <span class="trunk-vlans text-light"></span>
            </div> 

            <div class="vlan-info-box" style="display: none; margin-top: 5px;">
                <span style="color: #64748b; font-weight: bold;">VLAN no Access:</span> 
                <span class="vlan-data text-light"></span>
            </div>
            
            <div>
                <span class="badge-estado">Estado: <span class="estado-stp"></span></span>
            </div>

            <div class="error-mismatch-box" style="display: none; margin-top: 8px; padding: 6px; background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 4px;">
                <span style="color: #fca5a5; font-weight: bold; font-size: 12px;">
                    <i class="fas fa-exclamation-triangle"></i> Erro: Configuração Incompatível! One side is Trunk, other is Access.
                </span>
            </div>
        </div>
    </div>
</template>
