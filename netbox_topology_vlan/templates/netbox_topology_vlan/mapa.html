{% extends 'base/layout.html' %}
{% load static %}

{% block title %}Mapa Lógico de VLANs{% endblock %}

{% block content %}

{% include 'netbox_topology_vlan/inc/popup.html' %}

<div class="row mb-2">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-network-wired"></i> Mapa de VLANs</h4>
            <div class="d-flex gap-2">
                <input type="file" id="fileGNS3" style="display: none;" accept=".gns3">
                <button id="btnImportGNS3" class="btn btn-sm btn-warning">
                    <i class="mdi mdi-upload"></i> Importar GNS3
                </button>
                
                <button id="btnDownloadXML" class="btn btn-sm btn-info"><i class="mdi mdi-download"></i> XML</button>
                <button id="btnDownloadPNG" class="btn btn-sm btn-info"><i class="mdi mdi-image"></i> PNG</button>
            </div>
        </div>
        <hr class="mt-2 mb-2">
    </div>
</div>

<div class="row mb-2">
    <div class="col-md-7">
    <div class="card mb-0">
        <div class="card-body p-2 d-flex align-items-center">
            
            <div class="d-flex align-items-center me-4">
                <strong class="mb-0 me-2 text-muted" style="font-size: 13px;">1. Site:</strong>
                <select id="site-select" class="form-select form-select-sm" style="width: 170px;">
                    <option value="">-- Escolha o Site --</option>
                    {% for s in sites %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="d-flex flex-grow-1 align-items-center">
                <strong class="mb-0 me-2 text-muted" style="font-size: 13px;">2. VLAN(s):</strong>
                <div class="d-flex gap-2 flex-grow-1 flex-column">
                    <select id="vlan-select" class="form-select form-select-sm" multiple size="3" disabled>
                        {% for v in vlans %}
                            <option value="{{ v.id }}" data-site="{{ v.site.id|default:'' }}" {% if selected_vlan_id == v.id|stringformat:"s" %}selected{% endif %}>
                                VLAN {{ v.vid }} - {{ v.name }}
                            </option>
                        {% endfor %}
                    </select>
                    <small id="vlan-help-text" class="text-danger fw-bold" style="font-size: 10px; margin-top: -5px;">⚠ Selecione um Site primeiro</small>
                </div>
                <button id="btn-gerar" class="btn btn-sm btn-primary text-nowrap ms-2" style="height: 100%;" disabled>
                    <i class="mdi mdi-refresh"></i> Gerar
                </button>
            </div>
            
        </div>
    </div>
</div>
    
    <div class="col-md-5">
        <div class="card mb-0 bg-dark text-light" style="height: 100%;"> 
            <div class="card-body p-2 d-flex justify-content-around align-items-center">
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label" style="font-size: 10px; color: #adb5bd;">Nós</div>
                    <div class="fw-bolder stat-value" id="stat-nos" style="font-size: 15px;">0</div>
                </div>
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label" style="font-size: 10px; color: #adb5bd;">Ligações</div>
                    <div class="fw-bolder stat-value" id="stat-ligacoes" style="font-size: 15px;">0</div>
                </div>
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label" style="font-size: 10px; color: #adb5bd;">VLAN Ativa</div>
                    <div class="fw-bolder stat-value" id="stat-vlan" style="font-size: 15px;">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body p-0">
                <div id="mapa-rede" style="width: 100%; height: 650px; background-color: #f1f5f9; border-radius: 4px; border: 1px solid #dee2e6;"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script type="text/javascript" src="{% static 'netbox_topology_vlan/js/mapa.js' %}"></script>

{% endblock %}
