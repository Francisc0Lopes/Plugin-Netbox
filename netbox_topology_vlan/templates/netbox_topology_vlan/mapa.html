{% extends 'base/layout.html' %}
{% load static %}

{% block title %}Mapa Lógico de VLANs{% endblock %}

{% block content %}
<style>
    /* O Pop-up Escuro Moderno */
    div.vis-tooltip {
        position: absolute;
        visibility: hidden;
        padding: 12px;
        background-color: #1b1b22 !important; 
        color: #e2e8f0 !important; 
        border: 1px solid #334155 !important;
        border-radius: 8px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        z-index: 1000;
        font-family: var(--font-family-sans-serif, Arial, sans-serif);
        pointer-events: none;
        min-width: 210px;
    }
    .popup-header {
        color: #ffffff;
        border-bottom: 1px solid #334155;
        display: block;
        margin-bottom: 8px;
        padding-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
    }
    .popup-body {
        font-size: 12px;
        line-height: 1.5;
    }
    .badge-estado {
        background-color: #14532d;
        color: #4ade80;
        padding: 3px 8px;
        border-radius: 4px;
        font-weight: 600;
        display: inline-block;
        margin-top: 6px;
        font-size: 11px;
    }
    /* Estilos Estatísticas (Mais pequenos) */
    .stat-label { font-size: 10px; letter-spacing: 0.5px; color: #adb5bd; }
    .stat-value { font-size: 15px; color: #f8f9fa; margin-top: -2px; }
</style>

<template id="edge-popup-template">
    <div>
        <strong class="popup-header">
            <i class="mdi mdi-information-outline"></i> Detalhes da Ligação
        </strong>
        <div class="popup-body">
            Porta A: <span class="porta-a"></span> (<span class="modo-a"></span>)<br>
            Porta B: <span class="porta-b"></span> (<span class="modo-b"></span>)<br>
            <div>
                <span class="badge-estado">Estado: <span class="estado-stp"></span></span>
            </div>
        </div>
    </div>
</template>

<div class="row mb-2">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-network-wired"></i> Mapa de VLANs</h4>
            <div class="d-flex gap-2">
                <input type="file" id="fileGNS3" style="display: none;" accept=".gns3">
                <button id="btnImportGNS3" class="btn btn-sm btn-warning">
                    <i class="mdi mdi-upload"></i> Importar GNS3
                </button>
                
                <button id="btnDownloadXML" class="btn btn-sm btn-info"><i class="mdi mdi-download"></i> XML</button>
                <button id="btnDownloadPNG" class="btn btn-sm btn-info"><i class="mdi mdi-image"></i> PNG</button>
            </div>
        </div>
        <hr class="mt-2 mb-2">
    </div>
</div>

<div class="row mb-2">
    <div class="col-md-7">
        <div class="card mb-0">
            <div class="card-body p-2 d-flex justify-content-between align-items-center">
                <strong class="mb-0 me-3 text-muted" style="font-size: 13px;">Selecione a VLAN:</strong>
                <div class="d-flex gap-2 flex-grow-1">
                    <select id="vlan-select" class="form-select form-select-sm">
                        <option value="">-- Escolha uma VLAN --</option>
                        {% for v in vlans %}
                            <option value="{{ v.id }}" {% if selected_vlan_id == v.id|stringformat:"s" %}selected{% endif %}>
                                VLAN {{ v.vid }} - {{ v.name }}
                            </option>
                        {% endfor %}
                    </select>
                    <button id="btn-gerar" class="btn btn-sm btn-primary text-nowrap">
                        <i class="mdi mdi-refresh"></i> Gerar
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-5">
        <div class="card mb-0 bg-dark text-light"> 
            <div class="card-body p-2 d-flex justify-content-around align-items-center">
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label">Nós</div>
                    <div class="fw-bolder stat-value" id="stat-nos">0</div>
                </div>
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label">Ligações</div>
                    <div class="fw-bolder stat-value" id="stat-ligacoes">0</div>
                </div>
                <div class="text-center">
                    <div class="text-uppercase fw-bold stat-label">VLAN Ativa</div>
                    <div class="fw-bolder stat-value" id="stat-vlan">-</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body p-0">
                <div id="mapa-rede" style="width: 100%; height: 650px; background-color: #f1f5f9; border-radius: 4px; border: 1px solid #dee2e6;"></div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script>
    // Variável para guardar os dados e poder gerar o XML
    let globalDados = null; 

    // CORES NORMAIS: Router e Switch a Azul (#0d6efd)
    const svgRouter = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#0d6efd" stroke="#ffffff" stroke-width="3"/><path d="M50 20v60m30-30H20" stroke="white" stroke-width="8" stroke-linecap="round"/><path d="M40 30l10-10 10 10M40 70l10 10 10-10M30 40l-10 10 10 10M70 40l10 10-10 10" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    const svgSwitch = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="90" height="60" x="5" y="20" rx="8" fill="#0d6efd" stroke="#ffffff" stroke-width="3"/><path d="M15 45h70M50 45v35" stroke="#ffffff" stroke-width="5"/><circle cx="20" cy="35" r="4" fill="#ffffff"/><circle cx="35" cy="35" r="4" fill="#ffffff"/><circle cx="50" cy="35" r="4" fill="#ffffff"/><circle cx="65" cy="35" r="4" fill="#ffffff"/><circle cx="20" cy="65" r="4" fill="#ffffff"/><circle cx="50" cy="65" r="4" fill="#ffffff"/><circle cx="80" cy="65" r="4" fill="#ffffff"/></svg>`;
    
    function svgToDataUri(svg) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); }
    
    function getDeviceIcon(role) {
        role = (role || "").toLowerCase();
        if (role.includes('router')) return svgRouter;
        if (role.includes('switch')) return svgSwitch;
        return `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect x="10" y="20" width="80" height="60" rx="5" fill="#6c757d" stroke="#ffffff" stroke-width="2"/><text x="50" y="60" text-anchor="middle" fill="white" font-size="40">?</text></svg>`;
    }

    function criarPopup(ligacao) {
        const template = document.getElementById('edge-popup-template');
        const clone = template.content.cloneNode(true);
        const div = document.createElement('div');
        div.appendChild(clone);

        div.querySelector('.porta-a').textContent = ligacao.source_port;
        div.querySelector('.modo-a').textContent = ligacao.source_mode;
        div.querySelector('.porta-b').textContent = ligacao.target_port;
        div.querySelector('.modo-b').textContent = ligacao.target_mode;
        div.querySelector('.estado-stp').textContent = ligacao.stp_state || 'Forwarding';

        return div;
    }

    document.getElementById('btn-gerar').addEventListener('click', function() {
        const vlanId = document.getElementById('vlan-select').value;
        if (!vlanId) return alert('Por favor, selecione uma VLAN.');

        document.getElementById('mapa-rede').style.opacity = '0.5';
        fetch(`/api/plugins/topology-vlan/get-topology/?vlan_id=${vlanId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('mapa-rede').style.opacity = '1';
                if (data.Erro) return alert(data.Erro);
                
                document.getElementById('stat-nos').innerText = data.nos.length;
                document.getElementById('stat-ligacoes').innerText = data.ligacoes.length;
                const select = document.getElementById('vlan-select');
                document.getElementById('stat-vlan').innerText = select.options[select.selectedIndex].text.split(' - ')[0];

                desenharMapa(data);
            });
    });

    function desenharMapa(dados) {
        globalDados = dados; // Guarda os dados para a exportação XML

        const nodes = new vis.DataSet(dados.nos.map(no => ({
            id: no.id, label: no.name, shape: 'image', image: svgToDataUri(getDeviceIcon(no.role)),
            font: { color: '#334155', size: 14, face: 'monospace', vadjust: 55, bold: true },
            shadow: { enabled: true, color: 'rgba(0,0,0,0.1)', size: 5 }
        })));

        const edges = new vis.DataSet(dados.ligacoes.map(ligacao => {
            const isTrunk = ligacao.source_mode === 'Trunk' || ligacao.target_mode === 'Trunk';
            const corLigacao = isTrunk ? '#f97316' : '#475569';

            return {
                from: ligacao.source, to: ligacao.target,
                label: ligacao.source_port + ' ↔ ' + ligacao.target_port,
                title: criarPopup(ligacao),
                dashes: isTrunk, 
                color: { color: corLigacao, highlight: '#3b82f6', hover: '#0ea5e9' },
                width: 3, 
                font: { align: 'top', size: 11, color: '#475569', background: 'rgba(241, 245, 249, 0.85)' },
                smooth: { type: 'continuous' }
            };
        }));

        new vis.Network(document.getElementById('mapa-rede'), { nodes, edges }, {
            physics: { forceAtlas2Based: { gravitationalConstant: -120, springLength: 220 } },
            interaction: { hover: true, tooltipDelay: 100 }
        });
    }

    // ==========================================
    // EXPORTAÇÃO PNG
    // ==========================================
    document.getElementById('btnDownloadPNG').addEventListener('click', function() {
        const canvas = document.querySelector('#mapa-rede canvas');
        if (!canvas) return alert('Por favor, gere o mapa primeiro!');

        // Cria um canvas temporário para aplicar o fundo cinzento (#f1f5f9)
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        
        tempCtx.fillStyle = '#f1f5f9';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(canvas, 0, 0);

        const link = document.createElement('a');
        link.download = 'Topologia_VLAN.png';
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
    });

    // ==========================================
    // EXPORTAÇÃO XML
    // ==========================================
    document.getElementById('btnDownloadXML').addEventListener('click', function() {
        if (!globalDados) return alert('Por favor, gere o mapa primeiro!');

        let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<topologia>\n';
        
        xml += '  <nos>\n';
        globalDados.nos.forEach(no => {
            const safeName = no.name.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            xml += `    <no id="${no.id}" nome="${safeName}" role="${no.role}" />\n`;
        });
        xml += '  </nos>\n';
        
        xml += '  <ligacoes>\n';
        globalDados.ligacoes.forEach(lig => {
            xml += `    <ligacao source="${lig.source}" target="${lig.target}" source_port="${lig.source_port}" target_port="${lig.target_port}" source_mode="${lig.source_mode}" target_mode="${lig.target_mode}" stp_state="${lig.stp_state}" />\n`;
        });
        xml += '  </ligacoes>\n';
        
        xml += '</topologia>';

        const blob = new Blob([xml], { type: 'text/xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'Topologia_VLAN.xml';
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
    });

    // ==========================================
    // IMPORTAÇÃO GNS3
    // ==========================================
    
    // Função auxiliar para ir buscar o token de segurança do Django (CSRF)
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Quando clicas no botão bonito, ele "clica" no input de ficheiro invisível
    document.getElementById('btnImportGNS3').addEventListener('click', () => {
        document.getElementById('fileGNS3').click();
    });

    // Quando o utilizador escolhe o ficheiro GNS3
    document.getElementById('fileGNS3').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        // Feedback visual
        document.getElementById('btnImportGNS3').innerHTML = '<i class="mdi mdi-loading mdi-spin"></i> A Importar...';

        // Envia o ficheiro para o backend (vamos criar esta view no próximo passo)
        fetch('/api/plugins/topology-vlan/import-gns3/', {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCookie('csrftoken') // Muito importante para o Django aceitar!
            },
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('btnImportGNS3').innerHTML = '<i class="mdi mdi-upload"></i> Importar GNS3';
            if (data.Erro) {
                alert('Erro na importação: ' + data.Erro);
            } else {
                alert(`Sucesso! Foram criados ${data.criados} equipamentos.`);
                location.reload(); // Recarrega a página para atualizar os dados
            }
        })
        .catch(err => {
            document.getElementById('btnImportGNS3').innerHTML = '<i class="mdi mdi-upload"></i> Importar GNS3';
            console.error(err);
            alert('Ainda não criámos a API de backend para o GNS3! Avançamos para o views.py?');
        });

        e.target.value = ''; // Limpa o input
    });

    window.onload = () => { if (document.getElementById('vlan-select').value) document.getElementById('btn-gerar').click(); };
</script>
{% endblock %}
