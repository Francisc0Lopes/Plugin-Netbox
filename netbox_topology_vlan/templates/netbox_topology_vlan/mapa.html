{% extends 'base/layout.html' %}
{% load static %}

{% block title %}Mapa Lógico de VLANs{% endblock %}

{% block content %}

<div class="row mb-3">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="mb-0">
                <i class="fas fa-network-wired"></i> Mapa de VLANs
            </h2>
            <div class="d-flex gap-3">
                <button id="btnDownloadImage" class="btn btn-info" href="#">
				<i class="mdi mdi-download"></i> Download XML
                </button>
                <button id="btnDownloadImage" class="btn btn-info" href="#">
				<i class="mdi mdi-download"></i> Download PNG
                </button>
            </div>
        </div>
        <hr class="mt-2 mb-0">
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Mapeamento Lógico</h5>
                <p class="text-muted small">Topologia lógica baseada nas configurações de Access/Trunk.</p>
                
                <div class="d-flex gap-2">
                    <select id="vlan-select" class="form-select form-select-sm">
                        <option value="">-- Escolha uma VLAN --</option>
                        {% for v in vlans %}
                            <option value="{{ v.id }}" {% if selected_vlan_id == v.id|stringformat:"s" %}selected{% endif %}>
                                VLAN {{ v.vid }} - {{ v.name }}
                            </option>
                        {% endfor %}
                    </select>
                    <button id="btn-gerar" class="btn btn-sm btn-primary">
                        <i class="mdi mdi-refresh"></i> Gerar Mapa
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-body p-0">
                <div id="mapa-rede" style="width: 100%; height: 700px;">
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
    // --- Definição de Ícones SVG (Para garantir fidelidade profissional) ---
    // Router (Círculo vermelho com setas)
    const svgRouter = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#dc3545" stroke="#ffffff" stroke-width="2"/><path d="M50 20v60m30-30H20" stroke="white" stroke-width="8" stroke-linecap="round"/><path d="M40 30l10-10 10 10M40 70l10 10 10-10M30 40l-10 10 10 10M70 40l10 10-10 10" fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // Switch (Retângulo azul com portas)
    const svgSwitch = '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="90" height="60" x="5" y="20" rx="5" fill="#0d6efd" stroke="#ffffff" stroke-width="2"/><path d="M15 45h70M50 45v35" stroke="#ffffff" stroke-width="5"/><circle cx="20" cy="35" r="4" fill="#198754"/><circle cx="35" cy="35" r="4" fill="#198754"/><circle cx="50" cy="35" r="4" fill="#198754"/><circle cx="65" cy="35" r="4" fill="#198754"/><circle cx="80" cy="35" r="4" fill="#198754"/><circle cx="20" cy="65" r="4" fill="white"/><circle cx="35" cy="65" r="4" fill="white"/><circle cx="50" cy="65" r="4" fill="white"/><circle cx="65" cy="65" r="4" fill="white"/><circle cx="80" cy="65" r="4" fill="white"/></svg>';

    // Função para converter string SVG em data URI para o Vis.js
    function svgToDataUri(svg) {
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // --- Lógica Principal ---
    document.getElementById('btn-gerar').addEventListener('click', function() {
        var vlanId = document.getElementById('vlan-select').value;
        if (!vlanId) {
            alert('Por favor, selecione uma VLAN.');
            return;
        }

        // Feedback de carregamento
        document.getElementById('mapa-rede').style.opacity = '0.5';

        fetch(`/api/plugins/topology-vlan/get-topology/?vlan_id=${vlanId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('mapa-rede').style.opacity = '1';
                if (data.Erro) {
                    alert(data.Erro);
                    return;
                }
                desenharMapa(data);
            })
            .catch(error => {
                document.getElementById('mapa-rede').style.opacity = '1';
                console.error('Erro ao chamar a API:', error);
                alert('Erro ao carregar os dados. Verifique a consola.');
            });
    });

    function desenharMapa(dados) {
        var nodes = new vis.DataSet(
            dados.nos.map(no => {
                // Identifica se é router com base no nome
                let isRouter = no.name.toLowerCase().startsWith('r');
                return {
                    id: no.id,
                    label: no.name,
                    shape: 'image', // Mudamos de 'icon' para 'image'
                    image: isRouter ? svgToDataUri(svgRouter) : svgToDataUri(svgSwitch),
                    font: { 
                        color: '#ffffff', // Texto branco para contrastar
                        size: 16, 
                        face: 'monospace',
                        vadjust: 55 // Afasta o texto para baixo da imagem
                    },
                    shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 8 }
                };
            })
        );

        var edges = new vis.DataSet(
            dados.ligacoes.map(ligacao => {
                // Trunk = Laranja Tracejado | Access = Verde Contínuo
                var isTrunk = ligacao.source_mode === 'Trunk' || ligacao.target_mode === 'Trunk';
                
                return {
                    from: ligacao.source,
                    to: ligacao.target,
                    label: ligacao.source_port + ' ↔ ' + ligacao.target_port,
                    dashes: isTrunk, 
                    color: { 
                        color: isTrunk ? '#fd7e14' : '#198754', // Laranja Trunk, Verde Access
                        highlight: '#00d4ff',
                        hover: '#ffffff'
                    },
                    width: 3,
                    font: { align: 'top', size: 11, color: '#adb5bd' },
                    shadow: true
                };
            })
        );

        var container = document.getElementById('mapa-rede');
        var data = { nodes: nodes, edges: edges };
        
        var options = {
            physics: { 
                enabled: true,
                barnesHut: { 
                    gravitationalConstant: -7000, 
                    springLength: 200,
                    springConstant: 0.04
                },
                stabilization: { iterations: 150 }
            },
            interaction: {
                hover: true,
                navigationButtons: true, // Adiciona botões de zoom profissionais
                keyboard: true
            }
        };

        new vis.Network(container, data, options);
    }

    // --- AUTOMAÇÃO ---
    // Executa automaticamente quando a página carrega se virmos do botão da VLAN
    window.onload = function() {
        const vlanSelect = document.getElementById('vlan-select');
        if (vlanSelect.value !== "") {
            // "Clica" no botão por nós
            document.getElementById('btn-gerar').click();
        }
    };
</script>
{% endblock %}
